server {
    listen ${PORT};
    server_name _;
    root /app/public;
    index index.php;

    # Alpine's nginx package defaults to logging into files inside the
    # container (/var/log/nginx/*.log). Render only captures each
    # process's stdout/stderr, so without this override nginx's own
    # access/error logs — including any request nginx rejects before it
    # ever reaches PHP-FPM — are invisible in the Render log stream.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # Static assets served directly by nginx, never touching PHP.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
    }
}
